version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: asynccraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/asynccraft
      OPENAI_API_KEY: sk-mock-key-for-demo
      ACTIVE_SKIN: ops_dispatch
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./asynccraft:/app/asynccraft
      - ./alembic:/app/alembic
    command: sh -c "alembic upgrade head && uvicorn asynccraft.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
